name: verificación

# Criterio E3: E1 y E2 en cada push.
on:
  push:
  pull_request:

jobs:
  backend:
    name: pruebas del backend (E1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Los mismos dos pasos que documenta el README para un clon limpio. La
      # CI corre el comando real de CLAUDE.md §5 en vez de reconstruir el
      # entorno con `services:` de Actions: así no puede pasar que la CI
      # apruebe una configuración que en la máquina de Johan no levanta.
      - name: Preparar entorno
        run: cp .env.example .env

      # Criterio F3. Las pruebas ya migran su propia base en `conftest.py`, así
      # que una migración rota las hace fallar igualmente. Este paso cubre algo
      # distinto: que `alembic upgrade head` funcione por el camino real del
      # despliegue, contra la base que levanta compose.
      - name: Migraciones
        run: docker compose run --rm api alembic upgrade head

      - name: docker compose run api pytest
        run: docker compose run --rm api pytest

      # AY5 (ADR 0017): una copia que nunca se restauró es una suposición. Se
      # copia la base que dejaron las migraciones, se restaura en otra y se
      # comprueba que el trigger del ADR 0008 llegó con ella. Falla si subir
      # el digest de Postgres rompe `pg_dump` o el script.
      #
      # Se busca el mensaje del trigger y no solo que `DELETE` falle: sin la
      # base `restaurada`, psql también fallaría, y la prueba pasaría sin
      # haber comprobado nada.
      - name: Copia y restauración de la base
        run: |
          docker compose run --rm copias una
          docker compose run --rm copias restaurar "$(ls copias | tail -n 1)" restaurada
          salida=$(docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d restaurada -c "DELETE FROM traspaso"' 2>&1 || true)
          echo "$salida"
          echo "$salida" | grep -q "append-only"

  frontend:
    name: tsc y build (E2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # La misma versión que usa la etapa de build de web/Dockerfile.
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci` y no `install`: respeta el lockfile en vez de resolver de nuevo,
      # que es lo que hace reproducible la comprobación.
      - name: Instalar dependencias
        run: npm --prefix web ci

      - name: npm run check
        run: npm --prefix web run check
