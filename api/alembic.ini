# Configuración de Alembic.
#
# **No hay `sqlalchemy.url` aquí, y es deliberado.** El criterio A3 prohíbe
# direcciones escritas en el código o en la configuración versionada; `env.py`
# la toma de `DATABASE_URL`, la misma variable que usa la aplicación. Así no
# existe la posibilidad de migrar una base distinta de la que se sirve.

[alembic]
script_location = migrations
prepend_sys_path = .
# Explícito: sin esto Alembic 1.19 avisa de que recae en el troceo antiguo por
# espacios, comas y dos puntos — que en una ruta de Windows es una trampa.
path_separator = os

# Nombre de archivo con fecha delante: el orden alfabético coincide con el
# cronológico y las migraciones se leen en orden al abrir la carpeta.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
