# Astrolabio — los tres servicios de la Fase 0.
#
# Ninguna dirección ni puerto va escrito aquí como literal: todo sale de .env
# (criterio A3). Copiar .env.example a .env y `docker compose up --build`.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Explícito a propósito: la imagen de Postgres 18 cambió su PGDATA por
      # defecto, y dejarlo implícito ata el volumen a la versión de la imagen.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # De esto depende que A1 no tenga pasos manuales: la api no arranca
      # hasta que Postgres acepta conexiones de verdad.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: ${API_PORT}
      # La sonda de A4 la necesita para emitir la cookie con el mismo `Secure`
      # que usará la sesión real.
      COOKIE_SECURE: ${COOKIE_SECURE}
      SEED_INVESTIGADOR_USER: ${SEED_INVESTIGADOR_USER}
      SEED_INVESTIGADOR_PASSWORD: ${SEED_INVESTIGADOR_PASSWORD}
      SEED_EDITOR_USER: ${SEED_EDITOR_USER}
      SEED_EDITOR_PASSWORD: ${SEED_EDITOR_PASSWORD}
      VAULT_VOZ_DEL_COSMOS_PATH: /vault
    volumes:
      # Solo `03-Negocios/Voz-del-Cosmos/`, nunca la raíz del vault: el §2.5
      # prohíbe el acceso al vault personal completo, donde está el diario.
      # El montaje acotado lo hace imposible desde fuera del código.
      #
      # `:ro` porque el ADR 0001 le da la autoridad de `literature` al vault y
      # a Astrolabio solo la lectura. Cuando llegue el exportador de la Fase I
      # necesitará escritura, y la tendrá sobre `Contenido/` únicamente.
      - ${VAULT_HOST_PATH}:/vault:rw
      # `Investigacion/` sigue en solo lectura y montada aparte: el ADR 0001
      # le da al vault la autoridad sobre `literature`, así que ahí Astrolabio
      # no escribe nunca — y que no pueda lo impone el sistema de archivos, no
      # la buena voluntad del código.
      #
      # El resto de la carpeta queda escribible porque el exportador toca dos
      # sitios, `Contenido/` y el MOC, y montar un archivo suelto no sirve:
      # Docker crea las rutas que faltan como directorios, así que un vault
      # sin configurar acabaría con una carpeta llamada `MOC-VozDelCosmos.md`.
      - ${VAULT_HOST_PATH}/Investigacion:/vault/Investigacion:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "${API_PORT}"

  web:
    build: ./web
    environment:
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:80"

volumes:
  db-data:
